<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Civilink Community</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="mainNavbar"></div>

  <!-- Main Container -->
  <main class="container py-5">
    <div class="auth-container" style="max-width: 600px;">
      
      <!-- Registration Card -->
      <div class="custom-card p-4 p-md-5">
        <div class="auth-header">
          <div class="stat-icon bg-success-subtle text-success mx-auto mb-3">
            <i class="bi bi-person-plus-fill fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">Create an Account</h3>
          <p class="text-muted small">Join as an Individual Volunteer, NGO, or Corporate Organization.</p>
        </div>

        <!-- Alert Box -->
        <div id="regAlert" class="alert alert-danger d-none small py-2" role="alert"></div>

        <form id="registerForm">
          
          <!-- Role Selection Selector -->
          <div class="mb-4">
            <label class="form-label fw-semibold small">Select Account Type / Role</label>
            <div class="row g-2" id="roleSelectorRow">
              <div class="col-4">
                <input type="radio" class="btn-check" name="role" id="roleUser" value="USER" checked autocomplete="off">
                <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center gap-1" for="roleUser">
                  <i class="bi bi-person fs-5"></i>
                  <span class="small fw-semibold">Volunteer</span>
                </label>
              </div>
              <div class="col-4">
                <input type="radio" class="btn-check" name="role" id="roleNGO" value="NGO" autocomplete="off">
                <label class="btn btn-outline-success w-100 py-2 d-flex flex-column align-items-center gap-1" for="roleNGO">
                  <i class="bi bi-heart fs-5"></i>
                  <span class="small fw-semibold">NGO</span>
                </label>
              </div>
              <div class="col-4">
                <input type="radio" class="btn-check" name="role" id="roleOrg" value="ORG" autocomplete="off">
                <label class="btn btn-outline-info w-100 py-2 d-flex flex-column align-items-center gap-1" for="roleOrg">
                  <i class="bi bi-building fs-5"></i>
                  <span class="small fw-semibold">Organization</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Basic Info -->
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label for="name" class="form-label fw-semibold small" id="nameLabel">Full Name / Representative Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="name" placeholder="e.g. Sarah Jenkins" required>
              </div>
            </div>

            <div class="col-12">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="sarah@example.com" required autocomplete="email">
              </div>
            </div>

            <div class="col-12">
              <label for="phone" class="form-label fw-semibold small">Phone / Contact Number (Optional)</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-0000">
              </div>
            </div>
          </div>

          <!-- Dynamic Organization Fields (Shown when NGO or ORG is selected) -->
          <div id="orgFieldsContainer" class="d-none border-top pt-3 mb-3">
            <div class="mb-3">
              <label for="organization_name" class="form-label fw-semibold small">Official Organization / NGO Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-building"></i></span>
                <input type="text" class="form-control" id="organization_name" placeholder="e.g. EarthCare Non-Profit Foundation">
              </div>
            </div>

            <div class="mb-3">
              <label for="bio" class="form-label fw-semibold small">Mission Statement / About Us</label>
              <textarea class="form-control" id="bio" rows="2" placeholder="Briefly describe your organization's goals and initiatives..."></textarea>
            </div>
          </div>

          <!-- Password Fields -->
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold small">Password (Min 6 chars)</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
              </div>
            </div>
            <div class="col-md-6">
              <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-check2-circle"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required minlength="6">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mb-3" id="registerBtn">
            <span id="regSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            Complete Registration
          </button>
        </form>

        <div class="text-center small text-muted border-top pt-3 mt-2">
          Already have an account? 
          <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign In</a>
        </div>

        <div class="text-center small text-muted mt-2">
          Need to register as an Administrator? 
          <a href="admin-register.html" class="fw-bold text-danger text-decoration-none ms-1">
            <i class="bi bi-shield-lock"></i> Admin Registration
          </a>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center">
    <div class="container">
      <div class="text-muted small">© 2026 Civilink Platform. Simple & secure registration.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js?v=3.0"></script>
  <script src="js/app.js?v=3.0"></script>
  <script>
    // Handle URL param role preselection
    const urlParams = new URLSearchParams(window.location.search);
    const preRole = urlParams.get('role');
    if (preRole && ['USER', 'NGO', 'ORG'].includes(preRole.toUpperCase())) {
      const radio = document.getElementById(`role${preRole.toUpperCase() === 'USER' ? 'User' : (preRole.toUpperCase() === 'NGO' ? 'NGO' : 'Org')}`);
      if (radio) {
        radio.checked = true;
      }
    }

    // Dynamic role UI toggle
    function updateRoleUI() {
      const selectedRole = document.querySelector('input[name="role"]:checked').value;
      const orgContainer = document.getElementById('orgFieldsContainer');
      const orgNameInput = document.getElementById('organization_name');
      const nameLabel = document.getElementById('nameLabel');

      if (selectedRole === 'NGO' || selectedRole === 'ORG') {
        orgContainer.classList.remove('d-none');
        orgNameInput.required = true;
        nameLabel.textContent = selectedRole === 'NGO' ? 'NGO Representative Name' : 'Organization Contact Person';
      } else {
        orgContainer.classList.add('d-none');
        orgNameInput.required = false;
        nameLabel.textContent = 'Full Name';
      }
    }

    document.querySelectorAll('input[name="role"]').forEach(radio => {
      radio.addEventListener('change', updateRoleUI);
    });
    updateRoleUI();

    // Handle Form Submit
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      const organization_name = document.getElementById('organization_name').value.trim();
      const bio = document.getElementById('bio').value.trim();

      const alertBox = document.getElementById('regAlert');
      const spinner = document.getElementById('regSpinner');
      const regBtn = document.getElementById('registerBtn');

      alertBox.classList.add('d-none');

      if (password !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match. Please verify.';
        alertBox.classList.remove('d-none');
        return;
      }

      spinner.classList.remove('d-none');
      regBtn.disabled = true;

      try {
        const payload = {
          name,
          email,
          password,
          role,
          phone: phone || null,
          organization_name: (role === 'NGO' || role === 'ORG') ? organization_name : null,
          bio: (role === 'NGO' || role === 'ORG') ? bio : null
        };

        const res = await AuthAPI.register(payload);
        if (res.success && res.token) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));

          showToast(`Account created successfully! Welcome, ${res.user.name}.`, 'success');
          setTimeout(() => {
            window.location.href = 'activities.html';
          }, 1000);
        } else {
          throw new Error(res.error || 'Registration failed.');
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Registration failed. Please check your inputs.';
        alertBox.classList.remove('d-none');
      } finally {
        spinner.classList.add('d-none');
        regBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
