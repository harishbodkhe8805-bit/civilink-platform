<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Civilink Platform</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="mainNavbar"></div>

  <!-- Auth Main Container -->
  <main class="container py-5">
    <div class="auth-container">
      
      <!-- Login Card -->
      <div class="custom-card p-4 p-md-5">
        <div class="auth-header">
          <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-3">
            <i class="bi bi-box-arrow-in-right fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-muted small">Log in to manage activities, submit requests, or access your platform dashboard.</p>
        </div>

        <!-- Alert box for errors -->
        <div id="loginAlert" class="alert alert-danger d-none small py-2" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label fw-semibold small">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" id="loginBtn">
            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
            Sign In to Platform
          </button>
        </form>

        <div class="text-center small text-muted border-top pt-3 mt-3">
          Don't have an account yet? 
          <a href="register.html" class="fw-bold text-primary text-decoration-none">Sign Up as User / NGO / Org</a>
        </div>

        <div class="text-center small text-muted mt-2">
          Administrator?
          <a href="admin-register.html" class="fw-bold text-danger text-decoration-none ms-1">
            <i class="bi bi-shield-lock-fill"></i> Admin Registration (Master Key)
          </a>
        </div>

        <!-- Quick Demo Credentials Accordion for 1-Click Fill -->
        <div class="accordion mt-4" id="demoAccountsAccordion">
          <div class="accordion-item border-0 bg-light rounded-3 overflow-hidden">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed py-2 px-3 small fw-semibold bg-light text-muted" type="button" data-bs-toggle="collapse" data-bs-target="#demoCollapse">
                <i class="bi bi-key me-2 text-primary"></i> Quick Demo Test Accounts (1-Click Fill)
              </button>
            </h2>
            <div id="demoCollapse" class="accordion-collapse collapse" data-bs-parent="#demoAccountsAccordion">
              <div class="accordion-body p-3 small">
                <div class="d-flex flex-column gap-2">
                  <button type="button" class="btn btn-sm btn-outline-danger text-start d-flex justify-content-between align-items-center" onclick="fillCreds('admin@platform.com', 'Admin@123')">
                    <span><strong>ADMIN:</strong> admin@platform.com</span>
                    <span class="badge bg-danger">Fill</span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center" onclick="fillCreds('contact@greenearth.ngo', 'Ngo@123')">
                    <span><strong>NGO:</strong> contact@greenearth.ngo</span>
                    <span class="badge bg-success">Fill</span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-info text-start d-flex justify-content-between align-items-center" onclick="fillCreds('csr@techforward.org', 'Org@123')">
                    <span><strong>ORG:</strong> csr@techforward.org</span>
                    <span class="badge bg-info text-dark">Fill</span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center" onclick="fillCreds('john.doe@example.com', 'User@123')">
                    <span><strong>USER:</strong> john.doe@example.com</span>
                    <span class="badge bg-primary">Fill</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center">
    <div class="container">
      <div class="text-muted small">© 2026 Civilink Platform. Role-Based Access Control.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Toggle Password Visibility
    document.getElementById('togglePasswordBtn').addEventListener('click', function() {
      const pwdInput = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwdInput.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });

    // 1-Click Credentials Filler Helper
    function fillCreds(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      showToast(`Filled credentials for ${email}`, 'info');
    }

    // Check query params for expired session
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('expired')) {
      const alertBox = document.getElementById('loginAlert');
      alertBox.textContent = 'Your session has expired. Please log in again.';
      alertBox.classList.remove('d-none');
    }

    // Handle Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');
      const spinner = document.getElementById('loginSpinner');
      const loginBtn = document.getElementById('loginBtn');

      alertBox.classList.add('d-none');
      spinner.classList.remove('d-none');
      loginBtn.disabled = true;

      try {
        const response = await AuthAPI.login(email, password);
        
        if (response.success && response.token) {
          localStorage.setItem('token', response.token);
          localStorage.setItem('user', JSON.stringify(response.user));

          showToast(`Login successful! Welcome back, ${response.user.name}.`, 'success');

          // Determine target destination based on Role and redirect params
          setTimeout(() => {
            let redirectUrl = urlParams.get('redirect');
            if (redirectUrl && !redirectUrl.includes('login') && !redirectUrl.includes('register')) {
              // Extract only filename to prevent absolute root path mismatch on Live Server
              const targetPage = redirectUrl.split('/').pop();
              window.location.href = targetPage || 'activities.html';
            } else if (response.user.role === 'ADMIN') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'activities.html';
            }
          }, 150);
        } else {
          throw new Error(response.error || 'Login failed.');
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Invalid email or password.';
        alertBox.classList.remove('d-none');
      } finally {
        spinner.classList.add('d-none');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
